<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Lambda has no system fonts. The Lambdas ship these in /var/task/fonts (FONTCONFIG_PATH),
     so text drawn on post images (sharp/librsvg) renders. Arimo is metric-compatible with
     Arial/Helvetica, which the image SVGs ask for. -->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>Helvetica</family><prefer><family>Arimo</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Arimo</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Arimo</family></prefer></alias>
</fontconfig>
